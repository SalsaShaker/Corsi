<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SalsaShaker – Corso</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--coral:#f38882;--red:#e0121b;--blue:#1f4e8c;--ink:#1c1416;--muted:#6a5a5d;--line:#ecd9d6;--paper:#fffaf8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Figtree",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hero{background:var(--coral);display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);flex-wrap:wrap;padding:24px 20px}
.hero img{width:min(240px,60vw);height:auto;display:block}
.hero h1{font:italic 500 clamp(2.3rem,6.5vw,4.2rem)/1 "Fraunces",Georgia,serif;margin:0;color:#fff;text-shadow:0 2px 0 rgba(150,10,15,.35)}
.hero p{margin:10px 0 0;color:#fff;font-weight:600;max-width:34ch}
.hero .maestri{width:min(260px,62vw);height:auto;border-radius:14px;border:4px solid #fff;box-shadow:0 6px 0 rgba(150,10,15,.3)}
.nav{max-width:900px;margin:0 auto;padding:16px 20px 0}.nav a{color:var(--blue);font-weight:600}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 72px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--red)}
.count{color:var(--muted)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.search{flex:1;min-width:200px;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--ink);background:#fff}
.order{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.order:hover{background:var(--ink);color:#fff}
.lesson{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:32px 0;border-bottom:1px solid var(--line)}
.date{font:600 1.5rem/1.15 "Fraunces",Georgia,serif;color:var(--red)}
.date small{display:block;font:400 .95rem "Figtree",sans-serif;color:var(--muted);margin-top:4px}
.lesson h2{font:600 1.5rem/1.2 "Fraunces",Georgia,serif;margin:0 0 6px}
.lesson p{margin:0 0 16px;max-width:62ch;color:var(--muted)}
.video{position:relative;aspect-ratio:16/9;background:#2a1a1d;border-radius:10px;overflow:hidden}
.video iframe,.video img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.play{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:rgba(40,10,15,.3);display:grid;place-items:center}
.play:hover{background:rgba(40,10,15,.1)}
.play span{width:72px;height:72px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.play svg{width:28px;height:28px;margin-left:4px;fill:#fff}
.missing{position:absolute;inset:0;display:grid;place-items:center;color:#f1d9d6;padding:16px;text-align:center}
.empty{padding:40px 0;color:var(--muted)}
.gate{max-width:420px;margin:0 auto;padding:40px 20px 56px;text-align:center}
.gate img{width:min(300px,80%);height:auto}
.gate p{color:var(--muted)}
.gate form{display:flex;gap:8px;margin-top:20px}
.pwbox{position:relative;flex:1;min-width:0}
.gate input{width:100%;min-width:0;font:inherit;padding:12px 48px 12px 14px;border-radius:8px;border:1px solid var(--ink);background:#fff}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.eye:hover{color:var(--ink)}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .off{display:none}.eye[aria-pressed="true"] .on{display:none}.eye[aria-pressed="true"] .off{display:inline}
.gate button[type=submit]{font:inherit;font-weight:600;background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
.err{color:var(--red);min-height:1.6em;margin:8px 0 0}
footer{text-align:center;padding:8px 20px 40px}
footer img{width:180px;height:auto;opacity:.9}
footer p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
[hidden]{display:none!important}
@media (max-width:700px){.lesson{grid-template-columns:1fr;gap:12px}.date small{display:inline;margin-left:8px}}
</style>
</head>
<body>
<header class="hero">
  <img src="logo-colore.jpg" alt="Logo SalsaShaker">
  <div><h1 id="titolo">Video delle lezioni</h1><p id="sottotitolo"></p></div>
  <img class="maestri" src="Vincenzo_e_Sara.jpeg" alt="Vincenzo e Sara, i maestri del corso">
</header>
<nav class="nav"><a href="index.html">← Tutti i corsi</a></nav>

<section class="gate" id="gate">
  <p>Inserisci la password che ti ha dato la scuola per vedere i video del corso.</p>
  <form id="form">
    <div class="pwbox">
      <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
      <button class="eye" id="eye" type="button" aria-label="Mostra password" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>
      </button>
    </div>
    <button type="submit">Entra</button>
  </form>
  <p class="err" id="err" role="alert"></p>
</section>

<main class="wrap" id="app" hidden>
  <div class="bar"><span class="count" id="count"></span><button class="order" id="order" type="button"></button></div>
  <div class="tools"><input class="search" id="q" type="search" placeholder="Cerca per titolo, descrizione o data" aria-label="Cerca tra le lezioni" autocomplete="off"></div>
  <div id="list"></div>
</main>

<script src="corsi.js"></script>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let lezioni=[],newest=true;

async function decifra(pw){
  const d=window.DATI, enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.salt),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.iv)},key,b64(d.data));
  return JSON.parse(new TextDecoder().decode(buf));
}
function el(t,a,c){const n=document.createElement(t);for(const k in a||{})k==="text"?n.textContent=a[k]:n.setAttribute(k,a[k]);(c||[]).forEach(x=>n.appendChild(x));return n}
function fmt(iso){const d=new Date(iso+"T12:00:00");return{g:d.toLocaleDateString("it-IT",{day:"numeric",month:"long"}),a:d.toLocaleDateString("it-IT",{weekday:"long",year:"numeric"})}}

function videoBox(l){
  const box=el("div",{class:"video"});
  if(!l.video){box.appendChild(el("div",{class:"missing",text:"Video in arrivo"}));return box}
  const btn=el("button",{class:"play",type:"button","aria-label":"Guarda il video: "+l.titolo});
  btn.innerHTML='<span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z"/></svg></span>';
  btn.onclick=()=>{box.innerHTML="";box.appendChild(el("iframe",{src:"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(l.video)+"?autoplay=1&rel=0",title:l.titolo,allow:"autoplay; encrypted-media; picture-in-picture",allowfullscreen:""}))};
  box.appendChild(el("img",{src:"https://i.ytimg.com/vi/"+encodeURIComponent(l.video)+"/hqdefault.jpg",alt:"",loading:"lazy"}));
  box.appendChild(btn);return box;
}
const norm=t=>(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function render(){
  const list=$("list");list.innerHTML="";
  const q=norm($("q").value.trim()).split(/\s+/).filter(Boolean);
  const tutte=lezioni.length;
  const items=lezioni.filter(l=>{
    if(!q.length)return true;
    const f=fmt(l.data),hay=norm([l.titolo,l.descrizione,f.g,f.a,l.data].join(" "));
    return q.every(w=>hay.includes(w));
  }).sort((a,b)=>newest?b.data.localeCompare(a.data):a.data.localeCompare(b.data));
  $("count").textContent=q.length?items.length+" di "+tutte+(tutte===1?" lezione":" lezioni"):(tutte===1?"1 lezione":tutte+" lezioni");
  $("order").textContent=newest?"Dalla più recente":"Dalla più vecchia";
  if(!items.length){list.appendChild(el("p",{class:"empty",text:q.length?"Nessuna lezione corrisponde alla ricerca.":"Nessuna lezione ancora. Il primo video arriva dopo la prossima lezione."}));return}
  items.forEach(l=>{const f=fmt(l.data);
    list.appendChild(el("article",{class:"lesson"},[
      el("div",{class:"date"},[document.createTextNode(f.g),el("small",{text:f.a})]),
      el("div",{},[el("h2",{text:l.titolo}),el("p",{text:l.descrizione||""}),videoBox(l)])]));
  });
}
function mostra(d){
  lezioni=d.lezioni||[];
  $("titolo").textContent=d.corso||"Video delle lezioni";
  document.title=(d.corso||"Video")+" – SalsaShaker";
  $("sottotitolo").textContent="Con i maestri Vincenzo e Sara";
  $("gate").hidden=true;$("app").hidden=false;$("foot").hidden=false;render();
}
async function entra(pw){
  try{const d=await decifra(pw);try{sessionStorage.setItem("pw-"+slug,pw)}catch(e){}mostra(d);return true}
  catch(e){return false}
}
$("order").onclick=()=>{newest=!newest;render()};
$("q").oninput=render;
$("eye").onclick=()=>{const p=$("pw"),v=p.type==="password";p.type=v?"text":"password";
  $("eye").setAttribute("aria-pressed",v);$("eye").setAttribute("aria-label",v?"Nascondi password":"Mostra password")};
$("form").onsubmit=async e=>{e.preventDefault();
  if(!await entra($("pw").value)){$("err").textContent="Password non corretta. Riprova.";$("pw").select()}};
const slug=(new URLSearchParams(location.search).get("c")||"").toLowerCase();
const info=(window.CORSI||[]).find(c=>c.slug===slug);
if(info)$("titolo").textContent=info.nome;
function carica(){return new Promise((ok,ko)=>{
  if(!/^[a-z0-9-]+$/.test(slug))return ko();
  const s=document.createElement("script");s.src="dati-"+slug+".js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
(async()=>{
  try{await carica()}catch(e){$("gate").innerHTML='<p>Corso non trovato.</p><p><a href="index.html">Torna ai corsi</a></p>';return}
  let p=null;try{p=sessionStorage.getItem("pw-"+slug)}catch(e){}
  if(p)await entra(p);
})();
</script>
</main>
<footer id="foot"><img src="Trasparente.jpeg" alt="SalsaShaker"><p>Designed by Giò</p></footer>
</body>
</html>
